<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 64" fill="none">
  <defs>
    <linearGradient id="h-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
  </defs>
  <!-- Logomark: rounded hexagon shield -->
  <g transform="translate(6, 2)">
    <!-- Shield shape -->
    <path d="M30 2L52 14.7V40.3L30 53 8 40.3V14.7Z" fill="url(#h-grad)" stroke="none"/>
    <!-- Road / route abstraction -->
    <path d="M22 38L30 18L38 38" stroke="white" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Center node -->
    <circle cx="30" cy="26" r="3.2" fill="white" opacity="0.95"/>
    <!-- Connection lines radiating from center -->
    <line x1="30" y1="22.8" x2="30" y2="16" stroke="white" stroke-width="1.6" stroke-linecap="round" opacity="0.7"/>
    <line x1="33" y1="25" x2="39" y2="22" stroke="white" stroke-width="1.4" stroke-linecap="round" opacity="0.55"/>
    <line x1="27" y1="25" x2="21" y2="22" stroke="white" stroke-width="1.4" stroke-linecap="round" opacity="0.55"/>
    <!-- Small endpoint dots -->
    <circle cx="30" cy="15" r="1.8" fill="white" opacity="0.8"/>
    <circle cx="40" cy="21.5" r="1.6" fill="white" opacity="0.6"/>
    <circle cx="20" cy="21.5" r="1.6" fill="white" opacity="0.6"/>
    <!-- Road dashes -->
    <line x1="26.8" y1="34" x2="28.4" y2="29" stroke="white" stroke-width="1.2" stroke-linecap="round" opacity="0.45"/>
    <line x1="33.2" y1="34" x2="31.6" y2="29" stroke="white" stroke-width="1.2" stroke-linecap="round" opacity="0.45"/>
  </g>
  <!-- Typography -->
  <text x="74" y="30" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="28" font-weight="800" letter-spacing="-0.5" fill="#1e3a5f">Enter</text>
  <text x="155" y="30" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="28" font-weight="800" letter-spacing="-0.5" fill="#0f766e">Sol</text>
  <!-- Tagline -->
  <text x="74" y="48" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="9.5" font-weight="500" letter-spacing="2.5" fill="#64748b" text-transform="uppercase">TRANSPORT TECHNOLOGY</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 60" fill="none">
  <!-- Icono: camión estilizado + circuito digital -->
  <g transform="translate(0, 5)">
    <!-- Forma de camión abstracta -->
    <rect x="4" y="15" width="30" height="20" rx="3" fill="#1e3a5f"/>
    <rect x="34" y="20" width="12" height="15" rx="2" fill="#1e3a5f"/>
    <!-- Ruedas -->
    <circle cx="12" cy="38" r="4" fill="#0f766e"/>
    <circle cx="28" cy="38" r="4" fill="#0f766e"/>
    <circle cx="40" cy="38" r="4" fill="#0f766e"/>
    <!-- Nodos digitales / circuito -->
    <circle cx="10" cy="22" r="2" fill="#0f766e"/>
    <circle cx="20" cy="28" r="2" fill="#0f766e"/>
    <circle cx="30" cy="22" r="2" fill="#0f766e"/>
    <line x1="10" y1="22" x2="20" y2="28" stroke="#0f766e" stroke-width="1.2"/>
    <line x1="20" y1="28" x2="30" y2="22" stroke="#0f766e" stroke-width="1.2"/>
    <!-- Señal GPS -->
    <path d="M42 14 Q46 10 50 14" stroke="#0f766e" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <path d="M40 11 Q46 5 52 11" stroke="#0f766e" stroke-width="1.2" fill="none" stroke-linecap="round" opacity="0.6"/>
  </g>
  <!-- Texto EnterSol -->
  <text x="62" y="38" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="700" fill="#1e3a5f">Enter</text>
  <text x="138" y="38" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="700" fill="#0f766e">Sol</text>
</svg>

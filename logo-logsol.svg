<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="LogSol Icon">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="60%" stop-color="#2d5a8e"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <filter id="inner-shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Background rounded square -->
  <rect width="512" height="512" rx="96" fill="url(#bg-grad)"/>

  <!-- Signal ring -->
  <circle cx="256" cy="220" r="150" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="6"/>

  <!-- Truck body -->
  <g filter="url(#inner-shadow)">
    <rect x="120" y="220" width="200" height="100" rx="16" fill="#ffffff"/>
    <rect x="320" y="250" width="72" height="70" rx="12" fill="#ffffff"/>
    <!-- Cabin windshield -->
    <rect x="330" y="260" width="52" height="35" rx="8" fill="#1e3a5f" opacity="0.3"/>
  </g>

  <!-- Wheels -->
  <circle cx="180" cy="330" r="28" fill="#1e293b"/>
  <circle cx="180" cy="330" r="14" fill="#ffffff"/>
  <circle cx="280" cy="330" r="28" fill="#1e293b"/>
  <circle cx="280" cy="330" r="14" fill="#ffffff"/>
  <circle cx="365" cy="330" r="24" fill="#1e293b"/>
  <circle cx="365" cy="330" r="12" fill="#ffffff"/>

  <!-- Signal waves (connectivity) -->
  <path d="M230 170c18-18 50-18 68 0" stroke="#ffffff" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.9"/>
  <path d="M210 145c32-32 84-32 116 0" stroke="#ffffff" stroke-width="7" stroke-linecap="round" fill="none" opacity="0.6"/>
  <path d="M190 120c45-45 118-45 163 0" stroke="#ffffff" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.35"/>
  <!-- Signal dot -->
  <circle cx="264" cy="190" r="12" fill="#ffffff"/>

  <!-- Text below -->
  <text x="256" y="430" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="64" font-weight="700" fill="#ffffff" letter-spacing="-1">
    LogSol
  </text>
  <text x="256" y="465" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="20" fill="rgba(255,255,255,0.75)" letter-spacing="4">
    GESTIÓN DE FLOTAS
  </text>
</svg>

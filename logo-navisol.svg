<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="NaviSol Icon">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="60%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="pin-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <filter id="inner-shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Background rounded square -->
  <rect width="512" height="512" rx="96" fill="url(#bg-grad)"/>

  <!-- Compass ring -->
  <circle cx="256" cy="240" r="160" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="8"/>

  <!-- Cardinal points -->
  <polygon points="256,72 248,96 264,96" fill="#ffffff" opacity="0.9"/>
  <polygon points="256,408 248,384 264,384" fill="#ffffff" opacity="0.5"/>
  <polygon points="88,240 112,232 112,248" fill="#ffffff" opacity="0.5"/>
  <polygon points="424,240 400,232 400,248" fill="#ffffff" opacity="0.5"/>

  <!-- Map pin -->
  <g filter="url(#inner-shadow)">
    <path d="M256 120c-52 0-94 41-94 92 0 64 84 148 90 154 2 2 6 2 8 0 6-6 90-90 90-154 0-51-42-92-94-92z" fill="url(#pin-grad)"/>
    <circle cx="256" cy="208" r="36" fill="#0f766e"/>
    <rect x="252" y="192" width="8" height="6" rx="2" fill="#ffffff"/>
    <rect x="252" y="204" width="8" height="6" rx="2" fill="#ffffff"/>
    <rect x="252" y="216" width="8" height="6" rx="2" fill="#ffffff"/>
  </g>

  <!-- Text below -->
  <text x="256" y="440" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="64" font-weight="700" fill="#ffffff" letter-spacing="-1">
    NaviSol
  </text>
  <text x="256" y="475" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="20" fill="rgba(255,255,255,0.75)" letter-spacing="4">
    NAVEGACIÓN PROFESIONAL
  </text>
</svg>
